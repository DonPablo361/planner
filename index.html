<!DOCTYPE html>
<html lang="en" data-theme="light" data-scheme="crisp" data-edition="prod">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --ink:#0B2B26; --muted:#5F6D69; --line:#E9E2D8; --hair:rgba(11,43,38,.07);
  --accent:#235347; --accent-ink:#FFFFFF; --mint:#DAF1DE; --ice:#D6EBF3; --sand:#F6ECE3; --fig:#E7DFD3;
  --blue:#447F98; --danger:#C5211C; --warn:#A9501C; --warm:#F59B65;
  --shadow:0 1px 2px rgba(11,43,38,.04),0 10px 30px rgba(11,43,38,.06);
  --sans:"Aptos Light","Aptos",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Light","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:var(--sans);
  --bar:rgba(255,255,255,.84);
}
html[data-scheme=crisp]{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --line:#E5E5EA; --hair:rgba(0,0,0,.07);
  --accent:#1A8CFF; --accent-ink:#FFFFFF; --mint:#E6F2FF; --ice:#EAF4FF; --sand:#F2F2F7; --fig:#E3E3E8;
  --blue:#7CC2FF; --warm:#FF9F0A; --warn:#C25E00; --danger:#D70015;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06); --bar:rgba(255,255,255,.86);
}
html[data-scheme=crisp] .card,html[data-scheme=crisp] .list,html[data-scheme=crisp] .box,html[data-scheme=crisp] .tile{border-color:rgba(0,0,0,.06)}
html[data-scheme=crisp] .input{background:#F5F5F7;border-color:transparent}
html[data-scheme=crisp] .input:focus{background:#FFFFFF;border-color:var(--accent)}
html[data-scheme=crisp] .title-input,html[data-scheme=crisp] .title-input:focus{background:none;border-color:transparent transparent var(--line)}
html[data-scheme=crisp] .btn{background:#F2F2F7;border-color:transparent}
html[data-scheme=crisp] .btn.primary{background:var(--accent);color:#fff}
html[data-scheme=crisp] .btn.ghost{background:none}
html[data-scheme=crisp] .chip{background:#F2F2F7;border-color:transparent}
html[data-scheme=crisp] .chip.on{background:var(--accent);border-color:var(--accent)}
html[data-scheme=crisp] .chip.half{background:var(--mint);border-color:var(--accent)}
html[data-edition=prod] [data-only=dev],html[data-edition=dev] [data-only=prod]{display:none!important}
.dev-badge{position:fixed;top:calc(6px + env(safe-area-inset-top));right:10px;z-index:15;background:var(--warm);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:999px;pointer-events:none}
html[data-scheme=glacier]{
  --bg:#F3F8FA; --ink:#1B3440; --muted:#566B75; --line:#DADEE1; --hair:rgba(27,52,64,.08);
  --accent:#3B7289; --mint:#D6EBF3; --ice:#B9D8E1; --sand:#E4EDF1; --fig:#CFDDE3; --blue:#629BB5;
  --shadow:0 1px 2px rgba(27,52,64,.04),0 10px 30px rgba(27,52,64,.07);
}
html[data-scheme=stone]{
  --bg:#FBF7F3; --ink:#141211; --muted:#6A5E5B; --line:#E9DED4; --hair:rgba(20,18,17,.08);
  --accent:#7B625B; --mint:#F6ECE3; --ice:#EEE5E5; --sand:#F3E9E0; --fig:#DDD1D0; --blue:#B7A7A9;
  --shadow:0 1px 2px rgba(20,18,17,.04),0 10px 30px rgba(20,18,17,.06);
}
html[data-scheme=warm]{
  --bg:#FFF9F4; --ink:#2A1512; --muted:#735E57; --line:#F1E1D3; --hair:rgba(42,21,18,.08);
  --accent:#C5211C; --mint:#FDE6D2; --ice:#FBE4D2; --sand:#FAEBDD; --fig:#F1D8C4; --blue:#F59B65; --danger:#8E1512;
  --shadow:0 1px 2px rgba(42,21,18,.04),0 10px 30px rgba(42,21,18,.06);
}
@media (prefers-color-scheme: dark){
  html[data-theme=auto]{
    --bg:#051F20; --surface:#0B2B26; --ink:#E8F5EA; --muted:#9DBBA8; --line:#1B4038; --hair:rgba(218,241,222,.09);
    --accent:#8EB69B; --accent-ink:#051F20; --mint:#163832; --ice:#17363f; --sand:#102f2b; --fig:#1d443c;
    --blue:#7fb4cb; --danger:#F08A80; --warn:#F7BA79; --warm:#F59B65;
    --shadow:0 1px 2px rgba(0,0,0,.3); --bar:rgba(5,31,32,.86);
  }
  html[data-theme=auto][data-scheme=crisp]{--bg:#000000;--surface:#1C1C1E;--ink:#F5F5F7;--muted:#98989D;--line:#38383A;--hair:rgba(255,255,255,.08);--accent:#4DA8FF;--accent-ink:#000;--mint:#0E2A47;--ice:#0E2A47;--sand:#2C2C2E;--fig:#3A3A3C;--blue:#7CC2FF;--bar:rgba(0,0,0,.84)}
  html[data-theme=auto][data-scheme=crisp] .input,html[data-theme=auto][data-scheme=crisp] .btn,html[data-theme=auto][data-scheme=crisp] .chip{background:#2C2C2E}
  html[data-theme=auto][data-scheme=crisp] .chip.on,html[data-theme=auto][data-scheme=crisp] .btn.primary{background:var(--accent);color:#000}
  html[data-theme=auto][data-scheme=glacier]{--bg:#0F1D24;--surface:#16303B;--ink:#E6F2F7;--muted:#9DB9C6;--line:#244655;--accent:#8CC3DA;--accent-ink:#0F1D24;--mint:#1B3A47;--ice:#1B3A47;--sand:#152C36;--fig:#284B5B;--blue:#629BB5;--bar:rgba(15,29,36,.86)}
  html[data-theme=auto][data-scheme=stone]{--bg:#121110;--surface:#1E1B1A;--ink:#F6ECE3;--muted:#B7A7A9;--line:#34302E;--accent:#D9BFB5;--accent-ink:#121110;--mint:#2B2523;--ice:#2B2523;--sand:#23201F;--fig:#3B3432;--blue:#B7A7A9;--bar:rgba(18,17,16,.86)}
  html[data-theme=auto][data-scheme=warm]{--bg:#1B1C1E;--surface:#25262A;--ink:#FBEBDD;--muted:#C9A892;--line:#3A3B40;--accent:#F59B65;--accent-ink:#1B1C1E;--mint:#3A2A22;--ice:#3A2A22;--sand:#2C2D31;--fig:#46362D;--blue:#F7BA79;--danger:#FF8F87;--bar:rgba(27,28,30,.86)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:300 16px/1.45 var(--sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
h1{font:300 34px/1.08 var(--serif);letter-spacing:-.02em;margin:0}
h2{font:300 22px/1.2 var(--serif);letter-spacing:-.01em;margin:0 0 12px}
b,strong{font-weight:600}
.hint,.meta,.count,small,.eyebrow{font-weight:400}
h3{font-size:11.5px;margin:28px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
p{margin:0 0 10px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top)}
.wrap{max-width:780px;margin:0 auto;padding:26px 18px 40px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.back{background:none;border:0;padding:0 0 6px;color:var(--muted);font-size:14px;display:block}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
#tabs{display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;border:0;padding:9px 2px 8px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}
.row{display:flex;align-items:center}
.gap{gap:8px}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.input{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px;width:100%}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
select.input{appearance:auto}
textarea.input{min-height:104px;resize:vertical;line-height:1.5}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 18px;min-height:46px;font-weight:600;white-space:nowrap;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.active{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-left:6px;padding-right:6px}
.icon{background:none;border:0;min-width:40px;min-height:40px;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips.scroll,.seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.seg{display:flex;gap:8px;margin:0 -18px 18px;padding:0 18px 2px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:14px;white-space:nowrap;min-height:38px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.half{background:var(--mint);border-color:var(--accent)}
.chip i,.tag i,.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.chip.on i,.chip.on .swatch{box-shadow:0 0 0 1.5px var(--accent-ink)}
.sep{width:1px;background:var(--line);flex:none;margin:6px 2px}
.count{font-size:13px;color:var(--muted);margin:18px 2px 8px}
.empty{color:var(--muted);text-align:center;padding:30px 16px}
.hint{font-size:13px;color:var(--muted)}
.card,.list,.box{background:var(--surface);border:1px solid var(--hair);border-radius:22px;box-shadow:var(--shadow)}
.card{padding:18px}
.card+.card{margin-top:12px}
.list,.box{list-style:none;margin:0;padding:0;overflow:hidden}
.task{display:flex;align-items:flex-start;border-top:1px solid var(--hair)}
.task:first-child{border-top:0}
.check{flex:none;width:52px;height:52px;background:none;border:0;position:relative}
.check::before{content:"";position:absolute;left:16px;top:15px;width:21px;height:21px;border-radius:50%;border:1.6px solid var(--muted)}
.done>.check::before,.check.on::before{background:var(--accent);border-color:var(--accent)}
.done>.check::after,.check.on::after{content:"";position:absolute;left:23.5px;top:19px;width:5.5px;height:10.5px;border:solid var(--accent-ink);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.tbody{flex:1;min-width:0;background:none;border:0;text-align:left;padding:14px 16px 14px 0;display:block}
.ttitle{display:block;overflow-wrap:anywhere}
.done .ttitle{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:4px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px}
.bad{color:var(--danger);font-weight:600}
.warn{color:var(--warn);font-weight:600}
.good{color:var(--accent);font-weight:600}
.banner{background:var(--ice);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.srow{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 18px;border-top:1px solid var(--hair);min-height:54px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.srow:first-child{border-top:0}
.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm small,.srow small{color:var(--muted);font-size:13px}
.srow .val{text-align:right;font-variant-numeric:tabular-nums;padding-right:10px;white-space:nowrap}
.srow .val small{display:block}
button.srow{padding-right:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
.toggle input,.cb{width:22px;height:22px;accent-color:var(--accent);flex:none}
.big{font:300 40px/1.05 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--hair)}
.kv:first-child{border-top:0}
.kv span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.kv.total{font-weight:600;border-top:1px solid var(--line)}
/* sheet */
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--hair);background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sheet-head strong{font:400 19px var(--serif)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--hair);background:var(--bar)}
.sheet-foot .btn{flex:1}
.title-input{font:300 24px/1.2 var(--serif);border:0;background:none;padding:6px 0;border-radius:0;border-bottom:1px solid var(--line)}
.title-input:focus{box-shadow:none}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.frow>label,.frow>span:first-child{flex:none;max-width:46%}
.frow .input{max-width:210px}
.unit{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.unit .input{width:110px}
.subs{list-style:none;margin:0 0 8px;padding:0}
.sub{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lk{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:2px 2px 2px 14px;margin-bottom:6px}
.lk small{color:var(--muted);flex:none}
.lk button.t{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk button.t.done{text-decoration:line-through;color:var(--muted)}
/* dialog */
#dlg{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.dlg-back{position:absolute;inset:0;background:rgba(5,31,32,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dlg{position:relative;background:var(--surface);width:100%;max-width:500px;border-radius:26px 26px 0 0;padding:24px 18px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto}
@media (min-width:600px){#dlg{align-items:center}.dlg{border-radius:26px}}
.dlg-body label.fl{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.dlg-body .toggle{padding:12px 0}
.dlg-body .mrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.dlg-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.dlg-actions .btn{flex:1}
input[type=color].input{padding:4px;height:46px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
/* charts */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:430px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font:300 28px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;position:relative}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);min-width:0}
.bars .barbox{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0}
.bars .x{height:15px;line-height:15px}
.bars .bar{width:100%;max-width:40px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .v{color:var(--ink);font-weight:600;margin-bottom:3px}
.bars .x{margin-top:6px;white-space:nowrap}
.bars .tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--warm);pointer-events:none}
.hbar{display:grid;grid-template-columns:minmax(92px,36%) 1fr auto;align-items:center;gap:10px;width:100%;background:none;border:0;padding:7px 0;text-align:left;min-height:40px}
.hbar .track{height:10px;background:var(--sand);border-radius:5px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--accent);border-radius:5px}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;min-width:30px;font-size:14px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.heat{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
table.heat th{font-size:12px;color:var(--muted);font-weight:600;padding:2px}
table.heat th.r{text-align:right;width:74px}
table.heat td{padding:0}
table.heat button{width:100%;height:44px;border:1px solid var(--hair);border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-size:10px;fill:var(--muted);font-family:var(--sans)}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donutwrap svg{width:132px;height:132px;flex:none}
.leg{flex:1;min-width:150px}
.leg div{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.leg span.l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg span.p{color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--sand);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.prog span{display:block;height:100%;background:var(--accent);border-radius:4px}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.cal i{display:block;aspect-ratio:1;border-radius:4px;background:var(--sand)}
.cal i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--sand))}
.cal i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--sand))}
.cal i.l3{background:var(--accent)}
.cal i.fut{background:none}
/* graph */
.graph{position:relative;height:62dvh;min-height:340px;padding:0;overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none}
.gbar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gbar label{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.gbar input{accent-color:var(--accent);width:18px;height:18px}
.gempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 28px;text-align:center;color:var(--muted)}
/* training */
.figs{display:flex;justify-content:center;gap:6px}
svg.fig{width:100%;max-width:210px;height:auto;display:block}
.figs.three svg.fig{max-width:150px}
svg.fig .fb{fill:var(--fig);opacity:.55}
svg.fig .fr{fill:var(--fig)}
svg.fig .on{fill:var(--accent)}
svg.fig g[data-act]{cursor:pointer}
.setrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.setrow .n{width:20px;color:var(--muted);font-size:13px;flex:none;text-align:center}
.setrow .input{min-height:42px;padding:8px 8px;text-align:center;min-width:0}
.setrow select.input{flex:0 0 76px;padding:8px 4px}

<script>
/* ===== core.js ===== */
/* Planner core: helpers, storage, state, dialogs, navigation, charts. */
(function(){
'use strict';
const PL = window.PL = { S:{}, A:{}, B:{}, F:{}, mods:{}, sheets:{}, ui:{}, route:{ mod:'home', sub:null }, sheet:null };
// Edition: 'prod' is the everyday app, 'dev' the test version with every module. Each keeps its own separate storage.
PL.ED = document.documentElement.dataset.edition === 'dev' ? 'dev' : 'prod';
const DBN = PL.ED === 'dev' ? 'planner-dev' : 'planner';
const S = PL.S;

/* ---------- helpers ---------- */
const $ = PL.$ = (s, r) => (r || document).querySelector(s);
const $$ = PL.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = PL.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = PL.uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = PL.clone = o => JSON.parse(JSON.stringify(o));
const MONTHS = PL.MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = PL.DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_L = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ymd = PL.ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = PL.today = () => ymd(new Date());
const parseYmd = PL.parseYmd = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = PL.addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = PL.addMonths = (s, n) => {
  const p = s.split('-').map(Number), tm = p[1] - 1 + n, last = new Date(p[0], tm + 1, 0).getDate();
  return ymd(new Date(p[0], tm, Math.min(p[2], last)));
};
PL.addInterval = (s, unit, n) => unit === 'day' ? addDays(s, n) : unit === 'week' ? addDays(s, 7*n) : addMonths(s, unit === 'month' ? n : 12*n);
PL.daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
PL.fmtDate = s => {
  if (!s) return '';
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t, 1)) return 'Tomorrow';
  if (s === addDays(t, -1)) return 'Yesterday';
  const p = s.split('-').map(Number);
  return p[2] + ' ' + MONTHS[p[1]-1] + (p[0] !== new Date().getFullYear() ? ' ' + p[0] : '');
};
PL.fmtDay = s => { const p = s.split('-').map(Number); return p[2] + ' ' + MONTHS[p[1]-1]; };
PL.fmtLong = s => { const d = parseYmd(s); return DAYS_L[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_L[d.getMonth()]; };
PL.weekStart = s => { const d = parseYmd(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const num = PL.num = (n, dec) => { if (n == null || isNaN(n)) return '–'; const f = Math.pow(10, dec == null ? 2 : dec); return String(Math.round(n * f) / f); };
PL.fmtH = h => num(Number(h) || 0, 2) + ' h';
PL.money = n => { if (n == null || isNaN(n)) return '–'; const neg = n < 0, a = Math.abs(n); return (neg ? '−' : '') + (S.settings.currency || '€') + a.toLocaleString('en-GB', { maximumFractionDigits: a < 100 ? 2 : 0 }); };
PL.COLORS = ['var(--accent)','var(--blue)','#F59B65','#91766E','#8EB69B','#629BB5','#E4443F','#B7A7A9','#F7BA79','#163832'];
let toastTimer = null;
PL.toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3400); };

/* ---------- storage: the one place that reads and writes all data ---------- */
const Store = PL.Store = {
  db: null, mode: 'memory',
  async init(){
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(DBN, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      this.mode = 'indexeddb';
    } catch (e) {
      try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); this.mode = 'localstorage'; } catch (e2) { this.mode = 'memory'; }
    }
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  },
  load(){
    if (this.mode === 'indexeddb') return new Promise(res => {
      try { const r = this.db.transaction('kv').objectStore('kv').get('state'); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); }
    });
    if (this.mode === 'localstorage') { try { return Promise.resolve(JSON.parse(localStorage.getItem(DBN + '-state'))); } catch (e) { return Promise.resolve(null); } }
    return Promise.resolve(null);
  },
  save(state){
    try {
      if (this.mode === 'indexeddb') this.db.transaction('kv', 'readwrite').objectStore('kv').put(clone(state), 'state');
      else if (this.mode === 'localstorage') localStorage.setItem(DBN + '-state', JSON.stringify(state));
    } catch (e) { console.warn('Save failed', e); }
  }
};
PL.save = () => Store.save(S);

/* ---------- default data ---------- */
const P8 = ['#235347','#447F98','#91766E','#F59B65','#629BB5','#8EB69B','#B7A7A9','#E4443F'];
PL.PALETTE = P8;
PL.blankFilter = () => ({ text:'', status:'open', tags:[], tagMode:'any', fields:{}, actionable:false });
const sp = (tags, fields) => ({ tags, fields, items: [], links: [], views: [], ui: { filter: PL.blankFilter(), sort: 'smart' } });
const tg = (id, name, c, parentId) => ({ id, name, color: P8[c % P8.length], parentId: parentId || null });
PL.newSpace = kind => {
  if (kind === 'tasks') return sp(
    [tg('t_private','Private',1), tg('t_uni','Uni',2), tg('t_work','Work',3), tg('t_aus','Australia',0), tg('t_health','Health',5)],
    [{ id:'f_priority', name:'Priority', type:'select', role:'priority', options:['Low','Medium','High','Urgent'] },
     { id:'f_deadline', name:'Deadline', type:'date', role:'deadline' },
     { id:'f_time', name:'Time needed', type:'duration', role:'time' },
     { id:'f_effort', name:'Effort', type:'select', role:'effort', options:['Low','Medium','High'] },
     { id:'f_energy', name:'Energy needed', type:'select', role:'energy', options:['Low','Medium','High'] }]);
  if (kind === 'glow') return sp(
    [tg('g_skin','Skincare',1), tg('g_hair','Hair',2), tg('g_groom','Grooming',4), tg('g_teeth','Teeth',5), tg('g_frag','Fragrance',3), tg('g_post','Posture',6),
     tg('g_ward','Wardrobe',0), tg('g_tops','Tops',0,'g_ward'), tg('g_bottoms','Bottoms',0,'g_ward'), tg('g_shoes','Shoes',0,'g_ward'), tg('g_acc','Accessories',0,'g_ward')],
    [{ id:'f_need', name:'Need level', type:'select', role:'priority', options:['Additional','Basic','Essential'] },
     { id:'f_due', name:'Due', type:'date', role:'deadline' },
     { id:'f_price', name:'Price', type:'number', role:'price' },
     { id:'f_link', name:'Link', type:'url' }]);
  if (kind === 'buy') return sp(
    [tg('p_groc','Groceries',5), tg('p_clothes','Clothes',2), tg('p_home','Apartment',1), tg('p_other','Other',6)],
    [{ id:'f_max', name:'Max price', type:'number', role:'price' }, { id:'f_shop', name:'Shop', type:'text', show:true }, { id:'f_link', name:'Link', type:'url' }]);
  if (kind === 'bucket') return sp(
    [tg('b_travel','Travel',1), tg('b_exp','Experiences',3), tg('b_skill','Skills',0), tg('b_adv','Adventure',7)],
    [{ id:'f_year', name:'Target year', type:'number', show:true }, { id:'f_cost', name:'Estimated cost', type:'number', role:'price' }]);
  return sp([], [{ id:'f_need', name:'Priority', type:'select', role:'priority', options:['Low','Medium','High'] }, { id:'f_price', name:'Price', type:'number', role:'price' }, { id:'f_link', name:'Link', type:'url' }]);
};
const M = (id, name, parentId) => ({ id, name, parentId: parentId || null });
function defaultMuscles(){
  return [
    M('m_chest','Chest'), M('m_chest_upper','Upper chest','m_chest'), M('m_chest_mid','Middle chest','m_chest'), M('m_chest_lower','Lower chest','m_chest'),
    M('m_sh','Shoulders'), M('m_sh_front','Front shoulder','m_sh'), M('m_sh_mid','Mid shoulder','m_sh'), M('m_sh_rear','Rear shoulder','m_sh'),
    M('m_back','Back'), M('m_back_wide','Wide back (lats)','m_back'), M('m_back_upper','Upper back','m_back'), M('m_back_mid','Mid back','m_back'), M('m_back_lower','Lower back','m_back'),
    M('m_core','Core'), M('m_core_upper','Upper core','m_core'), M('m_core_lower','Lower core','m_core'), M('m_core_side','Side core','m_core'),
    M('m_neck','Neck'), M('m_neck_front','Front neck','m_neck'), M('m_neck_side','Side neck','m_neck'), M('m_neck_back','Back neck','m_neck'),
    M('m_legs','Legs'), M('m_glutes','Glutes','m_legs'), M('m_quads','Upper front (quads)','m_legs'), M('m_hams','Upper rear (hamstrings)','m_legs'), M('m_calves','Calves','m_legs'), M('m_add','Inner thigh (adductors)','m_legs'), M('m_abd','Outer hip (abductors)','m_legs'),
    M('m_arms','Arms'), M('m_bi_long','Biceps long head','m_arms'), M('m_bi_short','Biceps short head','m_arms'), M('m_brach','Brachialis','m_arms'), M('m_tri_long','Triceps long head','m_arms'), M('m_tri_short','Triceps short head','m_arms'), M('m_forearms','Forearms','m_arms')
  ];
}
function defaultState(){
  return {
    version: 4,
    settings: { askActual: true, askPrice: true, openNew: true, lastExport: null, theme: 'light', scheme: 'crisp', currency: '€' },
    spaces: { tasks: PL.newSpace('tasks'), glow: PL.newSpace('glow'), bucket: PL.newSpace('bucket'), buy: PL.newSpace('buy') },
    lists: [],
    training: { muscles: defaultMuscles(), exercises: [], plans: [], sessions: [], activities: [], goals: [] },
    health: { habits: [], checkins: {}, metrics: [{ id:'bm_weight', name:'Body weight', unit:'kg' }], metricLog: [], meals: [], mealPlan: {}, shopping: [], targets: { protein: null, kcal: null } },
    finance: { portfolios: [{ id:'pf_main', name:'Main portfolio' }], positions: [], goals: [], allocs: [], snapshots: [], api: { key: '' }, lastRefresh: null },
    admin: { contracts: [], docs: [], budget: { income: [], cats: [] } },
    future: { notes: [{ id:'n_who', title:'Who I want to be', text:'' }, { id:'n_matter', title:'What matters most to me', text:'' }, { id:'n_day', title:'My ideal ordinary day', text:'' }], goals: [], areas: ['Career','Business','Finance','Health','Relationships','Experiences','Learning'] }
  };
}
const isObj = o => o && typeof o === 'object' && !Array.isArray(o);
function fill(t, d){ for (const k in d) { if (t[k] === undefined || t[k] === null && isObj(d[k])) t[k] = clone(d[k]); else if (isObj(d[k]) && isObj(t[k])) fill(t[k], d[k]); else if (Array.isArray(d[k]) && !Array.isArray(t[k])) t[k] = clone(d[k]); } return t; }
function migrate(o){
  if (!isObj(o)) return {};
  if (o.version >= 2 || !Array.isArray(o.items)) return o;
  // stage-1 data: a single task list with durations in minutes
  const s = { tags: o.tags || [], fields: o.fields || [], items: o.items, links: o.links || [], views: o.views || [], ui: o.ui || {} };
  const dur = s.fields.filter(f => f.type === 'duration').map(f => f.id), conv = v => Math.round(Number(v) / 60 * 100) / 100;
  s.items.forEach(i => { dur.forEach(id => { if (i.values && i.values[id] != null) i.values[id] = conv(i.values[id]); }); if (i.actualMin != null) i.actualH = conv(i.actualMin); delete i.actualMin; });
  [s.ui.filter].concat(s.views.map(v => v.filter)).forEach(f => { if (f && f.fields) dur.forEach(id => { if (typeof f.fields[id] === 'number') f.fields[id] = conv(f.fields[id]); }); });
  return { version: 2, settings: o.settings, spaces: { tasks: s } };
}
function normSpace(s){
  ['tags','fields','items','links','views'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  s.ui = s.ui || {}; s.ui.filter = Object.assign(PL.blankFilter(), s.ui.filter || {}, { text: '' }); s.ui.sort = s.ui.sort || 'smart';
  s.fields.forEach(f => { if (f.type === 'select' && !Array.isArray(f.options)) f.options = []; });
  s.items.forEach(i => { i.tags = i.tags || []; i.values = i.values || {}; i.subtasks = i.subtasks || []; i.notes = i.notes || ''; i.createdAt = i.createdAt || new Date().toISOString(); });
}
PL.loadState = raw => {
  const oldV = raw && raw.version ? raw.version : 0, n = fill(migrate(raw || {}), defaultState());
  Object.keys(n.spaces).forEach(k => normSpace(n.spaces[k]));
  if (oldV && oldV < 3 && !n.spaces.glow.items.length) n.spaces.glow = PL.newSpace('glow'); // new Glow up categories, only if the list was still empty
  if (oldV && oldV < 4) n.settings.scheme = 'crisp'; // new default look
  n.version = 4;
  Object.keys(S).forEach(k => delete S[k]); Object.assign(S, n);
  PL.applyLook();
};
PL.SCHEMES = [['crisp','Crisp','#1A8CFF'],['forest','Forest','#235347'],['glacier','Glacier','#447F98'],['stone','Stone','#91766E'],['warm','Warm','#C5211C']];
PL.applyLook = () => {
  const el = document.documentElement; el.dataset.theme = S.settings.theme === 'auto' ? 'auto' : 'light';
  el.dataset.scheme = PL.SCHEMES.some(s => s[0] === S.settings.scheme) ? S.settings.scheme : 'crisp';
  try { const m = document.querySelector('meta[name="theme-color"]'), c = getComputedStyle(el).getPropertyValue('--bg').trim(); if (m && c) m.setAttribute('content', c); } catch (e) {}
};
PL.resetState = () => PL.loadState(null);

/* ---------- dialogs and forms ---------- */
const dialog = PL.dialog = opts => new Promise(res => {
  const d = $('#dlg');
  d.innerHTML = '<div class="dlg-back" data-dlg="cancel"></div><form class="dlg" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '"><h2>' + esc(opts.title) + '</h2><div class="dlg-body">' + (opts.body || '') + '</div><div class="dlg-actions">' +
    opts.actions.map(a => '<button type="' + (a.primary ? 'submit' : 'button') + '" class="btn ' + (a.primary ? 'primary ' : '') + (a.danger ? 'danger' : '') + '" data-dlg="' + a.id + '">' + esc(a.label) + '</button>').join('') + '</div></form>';
  d.hidden = false;
  const form = $('form', d);
  const finish = id => {
    const data = {}; new FormData(form).forEach((v, k) => { data[k] = v; });
    const v = opts.collect ? opts.collect(form) : null;
    d.hidden = true; d.innerHTML = ''; d.onclick = null; res({ action: id, data, v });
  };
  d.onclick = e => { const b = e.target.closest('[data-dlg]'); if (!b || b.type === 'submit') return; e.preventDefault(); finish(b.dataset.dlg); };
  form.onsubmit = e => { e.preventDefault(); const p = opts.actions.find(a => a.primary); finish(p ? p.id : 'ok'); };
  const first = form.querySelector('input:not([type=color]):not([type=checkbox]),select,textarea');
  if (first && !opts.noFocus && !(window.matchMedia && matchMedia('(pointer: coarse)').matches)) setTimeout(() => { try { first.focus(); } catch (e) {} }, 40);
});
PL.confirmDlg = async (title, text, label) => (await dialog({ title, body: '<p>' + esc(text) + '</p>', noFocus: true, actions: [{ id:'cancel', label:'Cancel' }, { id:'ok', label: label || 'Delete', danger: true }] })).action === 'ok';
const opt = (o, v) => { const val = Array.isArray(o) ? o[0] : o, lab = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(val) + '"' + (String(val) === String(v == null ? '' : v) ? ' selected' : '') + '>' + esc(lab) + '</option>'; };
PL.options = (list, v) => list.map(o => opt(o, v)).join('');
function fieldHtml(f){
  const id = 'ff_' + f.k, v = f.value, lab = '<label class="fl" for="' + id + '">' + esc(f.label) + '</label>', a = ' class="input" id="' + id + '" name="' + f.k + '"';
  if (f.type === 'static') return '<p class="hint" style="margin-top:12px">' + esc(f.label) + '</p>';
  if (f.type === 'check') return '<label class="toggle"><span>' + esc(f.label) + '</span><input type="checkbox" name="' + f.k + '"' + (v ? ' checked' : '') + '></label>';
  if (f.type === 'multi') return '<span class="fl" style="display:block;font-size:13px;color:var(--muted);margin:12px 0 5px">' + esc(f.label) + '</span>' + (f.options.length ? f.options.map(o => '<label class="mrow"><input class="cb" type="checkbox" name="' + f.k + '" value="' + esc(o[0]) + '"' + ((v || []).includes(o[0]) ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>').join('') : '<p class="hint">Nothing to choose from yet.</p>');
  if (f.type === 'select') return lab + '<select' + a + '>' + PL.options(f.options, v) + '</select>';
  if (f.type === 'textarea') return lab + '<textarea' + a + ' placeholder="' + esc(f.ph || '') + '">' + esc(v || '') + '</textarea>';
  if (f.type === 'number') return lab + '<input' + a + ' type="text" data-num inputmode="decimal" inputmode="decimal" step="' + (f.step || 'any') + '" value="' + esc(v == null ? '' : v) + '" placeholder="' + esc(f.ph || '') + '">';
  if (f.type === 'list') return lab + '<input' + a + ' type="text" list="' + id + '_l" autocomplete="off" value="' + esc(v || '') + '"><datalist id="' + id + '_l">' + (f.suggest || []).map(s => '<option value="' + esc(s) + '">').join('') + '</datalist>';
  return lab + '<input' + a + ' type="' + (f.type || 'text') + '" autocomplete="off" value="' + esc(v == null ? '' : v) + '" placeholder="' + esc(f.ph || '') + '">';
}
PL.form = async o => {
  const actions = []; if (o.del) actions.push({ id:'delete', label:'Delete', danger: true }); (o.extra || []).forEach(x => actions.push(x));
  actions.push({ id:'cancel', label:'Cancel' }, { id:'ok', label: o.ok || 'Save', primary: true });
  const r = await dialog({ title: o.title, body: o.fields.map(fieldHtml).join('') + (o.note ? '<p class="hint" style="margin-top:14px">' + esc(o.note) + '</p>' : ''), actions, collect: form => {
    const v = {};
    o.fields.forEach(f => {
      if (!f.k || f.type === 'static') return;
      if (f.type === 'multi') { v[f.k] = $$('[name="' + f.k + '"]:checked', form).map(x => x.value); return; }
      const el = form.elements[f.k]; if (!el) return;
      v[f.k] = f.type === 'check' ? el.checked : f.type === 'number' ? (el.value === '' || isNaN(Number(el.value)) ? null : Number(el.value)) : String(el.value).trim();
    });
    return v;
  } });

};

const EX_PREF = ['XETRA','F','STU','MU','BE','HM','DU','HA','AS','PA','MI','VI','SW','LSE'];

  if (ui.fbusy) return; ui.fbusy = true; if (!quiet) toast('Updating prices…');
  const cur = S.settings.currency === '$' ? 'USD' : S.settings.currency === '£' ? 'GBP' : 'EUR'; let ok = 0; const bad = [];

      const r = await fetch('https://eodhd.com/api/search/' + encodeURIComponent(p.isin.trim()) + '?api_token=' + encodeURIComponent(key) + '&fmt=json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const arr = (await r.json() || []).filter(x => x && Number(x.previousClose) > 0);
      const same = arr.filter(x => x.Currency === cur), pool = same.length ? same : arr;
      pool.sort((a, b) => { const ia = EX_PREF.indexOf(a.Exchange), ib = EX_PREF.indexOf(b.Exchange); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
      const hit = pool[0]; if (!hit) throw new Error('not found');
      p.price = Number(hit.previousClose); p.priceDate = hit.previousCloseDate || today(); p.priceSrc = hit.Code + '.' + hit.Exchange + (hit.Currency && hit.Currency !== cur ? ' (' + hit.Currency + ')' : ''); if (!p.name) p.name = hit.Name; ok++;

  const paired = days.filter(d => ci[d].sleepH != null && ci[d].energy != null), train = {}; S.training.sessions.concat(S.training.activities).forEach(x => { train[x.date] = 1; });
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length; let conn = '';
  if (paired.length >= 7) { const hi = paired.filter(d => ci[d].sleepH >= 7).map(d => ci[d].energy), lo = paired.filter(d => ci[d].sleepH < 7).map(d => ci[d].energy); if (hi.length >= 2 && lo.length >= 2) conn += '<div class="kv"><span>Energy after 7 or more hours of sleep</span><span><b>' + num(mean(hi), 1) + '</b> vs ' + num(mean(lo), 1) + ' after less</span></div>'; }
  const moodDays = days.filter(d => ci[d].mood != null);
  if (moodDays.length >= 7) { const on = moodDays.filter(d => train[d]).map(d => ci[d].mood), off = moodDays.filter(d => !train[d]).map(d => ci[d].mood); if (on.length >= 2 && off.length >= 2) conn += '<div class="kv"><span>Mood on training days</span><span><b>' + num(mean(on), 1) + '</b> vs ' + num(mean(off), 1) + ' on rest days</span></div>'; }
  h += PL.sec('Connections', conn ? conn + '<p class="hint" style="margin:8px 0 0">Simple averages from your own entries. They show what moves together, not what causes what.</p>' : '<p class="hint" style="margin:0">Comparisons such as sleep against energy, or mood on training days, appear after about a week of daily check-ins.</p>');
  return h;
}
PL.mods.insights = { title: 'Insights', render: insightsHtml };

/* ---------- settings ---------- */
function settingsHtml(){
  const modes = { indexeddb: 'Saved on this device', localstorage: 'Saved on this device (basic storage)', memory: 'Not saved in this preview' }, n = S.spaces.tasks.items.length;
  return '<h3 style="margin-top:0">Colour scheme</h3><div class="chips" style="margin-top:0">' + PL.SCHEMES.map(s => '<button class="chip ' + ((S.settings.scheme || 'forest') === s[0] ? 'on' : '') + '" data-act="s-scheme" data-v="' + s[0] + '" aria-pressed="' + ((S.settings.scheme || 'forest') === s[0]) + '"><span class="swatch" style="background:' + s[2] + '"></span>' + s[1] + '</button>').join('') + '</div>' +
    '<h3>Appearance</h3><div class="box"><label class="toggle"><span>Follow the device\'s dark mode</span><input type="checkbox" data-bind="s-theme"' + (S.settings.theme === 'auto' ? ' checked' : '') + '></label><div class="toggle"><label for="s-cur">Currency symbol</label><select class="input" id="s-cur" style="width:90px" data-bind="s-cur">' + PL.options(['€','$','£','CHF','A$'], S.settings.currency) + '</select></div></div>' +
    '<h3>Tasks and lists</h3><div class="box"><label class="toggle"><span>Open a new entry straight away to add its details</span><input type="checkbox" data-bind="s-open"' + (S.settings.openNew !== false ? ' checked' : '') + '></label><label class="toggle" style="border-top:1px solid var(--hair)"><span>Ask for time spent when a task is completed</span><input type="checkbox" data-bind="s-ask"' + (S.settings.askActual ? ' checked' : '') + '></label><label class="toggle" style="border-top:1px solid var(--hair)"><span>Ask for the price paid when a purchase is ticked off</span><input type="checkbox" data-bind="s-askprice"' + (S.settings.askPrice !== false ? ' checked' : '') + '></label></div>' +
    '<h3>Backup</h3><div class="card"><p>' + modes[PL.Store.mode] + '. ' + n + ' task' + (n === 1 ? '' : 's') + ', ' + S.spaces.buy.items.length + ' purchase' + (S.spaces.buy.items.length === 1 ? '' : 's') + (PL.ED === 'dev' ? ', ' + S.training.sessions.length + ' training sessions, ' + S.finance.positions.length + ' positions' : '') + '. Last backup: ' + (S.settings.lastExport ? fmtDate(S.settings.lastExport) : 'never') + '.</p>' +
    '<p class="hint">Everything lives only on this device. A backup file protects it and lets you copy your data to another device' + (PL.ED === 'dev' ? '. Backups from the everyday app can be imported here for testing, and the other way round.' : ', or into the test version.') + '</p><div class="row gap wrapx"><button class="btn primary" data-act="s-export">Export backup</button><button class="btn" data-act="s-import">Import backup</button><button class="btn danger" data-act="s-reset">Erase everything</button></div></div>' +
    '<p class="hint" style="margin-top:22px">Planner' + (PL.ED === 'dev' ? ' Dev' : '') + ' · version 5</p>';
}
PL.mods.settings = { title: 'Settings', render: settingsHtml };
B['s-theme'] = el => { S.settings.theme = el.checked ? 'auto' : 'light'; PL.applyLook(); save(); };
A['s-scheme'] = el => { S.settings.scheme = el.dataset.v; PL.applyLook(); save(); PL.render(); };
B['s-cur'] = (el, type) => { if (type !== 'change') return; S.settings.currency = el.value; save(); };
B['s-ask'] = el => { S.settings.askActual = el.checked; save(); };
B['s-askprice'] = el => { S.settings.askPrice = el.checked; save(); };
B['s-open'] = el => { S.settings.openNew = el.checked; save(); };
A['s-export'] = async () => { if (await PL.saveFile('planner-backup-' + today() + '.json', JSON.stringify(S, null, 1), 'application/json')) { S.settings.lastExport = today(); save(); PL.render(); } };
A['s-import'] = () => $('#import-file').click();
A['s-reset'] = async () => { if (await confirmDlg('Erase everything?', 'All data in every module on this device is deleted. Export a backup first if you might want it back.', 'Erase')) { PL.resetState(); save(); PL.go('home'); } };
$('#import-file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  let o; try { o = JSON.parse(await f.text()); } catch (x) { return toast('That file could not be read.'); }
  if (!o || typeof o !== 'object' || !(o.spaces || Array.isArray(o.items))) return toast('That is not a Planner backup file.');
  if (!(await confirmDlg('Replace everything?', 'The backup replaces all data currently on this device.', 'Replace'))) return;
  PL.loadState(o); save(); PL.go('home'); toast('Backup imported.');
});

/* ---------- start ---------- */
(async function init(){
  await PL.Store.init();
  PL.loadState(await PL.Store.load());
  PL.Fut.areasInUse(); PL.Fin.applyPlans(); PL.Fin.snapshot(); save();
  if (PL.ED === 'dev') document.body.insertAdjacentHTML('beforeend', '<div class="dev-badge">DEV</div>');
  PL.render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
  PL.ready = true;
})();
})();

</script>
